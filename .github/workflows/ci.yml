name: CI

# Every push to master and every pull request runs the whole suite on Linux, macOS and Windows. All three is
# the point: how a tree is watched, how a path is spelled and how a process is ended differ on each, and a claim
# about a platform is made by running on it. A newer push to the same branch or pull request cancels the run
# before it. `ci-pass` is the one check a merge waits on.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      budget_sizes:
        description: The sizes the budgets jobs read, by hand; a push reads 1000 and 100000
        type: string
        default: '1000 100000'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      # Specs compare bytes git wrote, so nothing is converted on the way in
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Which git the suite ran against is part of what a pass means
      - run: git --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # The suite against old gits, which the runners above do not have: they install a current one. The oldest git a
  # still-supported system ships (Debian 12's, and macOS's own with the developer tools), and `GIT_FLOOR`
  # (src/git-check.ts) built from its source, which is what holds the floor where it is.
  git:
    name: git (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian 12, runner: ubuntu-24.04, image: 'debian:12' }
          - { name: floor, runner: ubuntu-24.04, image: 'ubuntu:22.04', build: '2.35.0' }
          - { name: apple git, runner: macos-15, image: '' }
    steps:
      - name: Install the system's own git
        if: matrix.image != ''
        run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates curl procps >/dev/null
      # Built where it is installed ahead of the system's on the PATH, so it is the git every spec and the engine run
      - name: Build git at the floor
        if: matrix.build
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq make gcc libcurl4-gnutls-dev libexpat1-dev zlib1g-dev libssl-dev >/dev/null
          curl -fsSL "https://mirrors.edge.kernel.org/pub/software/scm/git/git-${{ matrix.build }}.tar.gz" | tar -xz -C /tmp
          make -C "/tmp/git-${{ matrix.build }}" -j"$(nproc)" prefix=/usr/local NO_GETTEXT=1 NO_TCLTK=1 install >/dev/null
      # On macOS the system's git is /usr/bin/git, behind the one the runner installs first on the PATH
      - name: Put the system's own git first
        if: matrix.image == ''
        run: |
          mkdir -p "$RUNNER_TEMP/system-git" && ln -s /usr/bin/git "$RUNNER_TEMP/system-git/git"
          echo "$RUNNER_TEMP/system-git" >> "$GITHUB_PATH"
      - run: git config --global core.autocrlf false && git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: git --version
      - run: npm ci
      - run: npm test

  # What the engine's work costs at 1,000 and 100,000 files, printed with the machine's conditions beside it. It
  # fails on no reading: the readings inform the budgets the README states (`npm run budgets`, README "Budgets").
  # A million files is read by hand.
  budgets:
    name: budgets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Through the environment, so what was typed into the dispatch is read as sizes and never run as a command
      - run: npm run budgets -- $BUDGET_SIZES
        shell: bash
        env:
          BUDGET_SIZES: ${{ inputs.budget_sizes || '1000 100000' }}

  ci-pass:
    if: always()
    needs: [suite, git]
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.suite.result }}" = "success" && test "${{ needs.git.result }}" = "success"
